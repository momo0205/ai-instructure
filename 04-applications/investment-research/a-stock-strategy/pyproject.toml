[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-strategy"
version = "0.1.0"
description = "A-share strategy backtesting research toolkit"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
live = [
  "mootdx>=0.11.7,<0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategy = ["static/*.html", "static/*.js", "static/*.css"]
