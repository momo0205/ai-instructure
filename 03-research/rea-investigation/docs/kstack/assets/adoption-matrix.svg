<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="28" fill="#FBFAF7"/>
  <text x="70" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F">什么时候值得接 REA：看任务缺哪类信息</text>
  <text x="70" y="116" font-family="Arial,sans-serif" font-size="19" fill="#667085">判断依据是“缺少的观察能力”，不是“新工具看起来很强”</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="165" width="510" height="440" rx="20" fill="#ECFDF3" stroke="#75E0A7" stroke-width="2"/>
    <text x="105" y="212" font-size="23" font-weight="700" fill="#067647">值得用：关键事实在产物里</text>
    <text x="105" y="262" font-size="19" fill="#344054">· 安装包行为和仓库源码对不上</text>
    <text x="105" y="302" font-size="19" fill="#344054">· 桌面应用跨进程的消息与处理路径</text>
    <text x="105" y="342" font-size="19" fill="#344054">· 闭源 SDK 的参数边界与错误语义</text>
    <text x="105" y="382" font-size="19" fill="#344054">· 两版命令行工具的外部行为差异</text>
    <text x="105" y="422" font-size="19" fill="#344054">· 旧格式迁移时的互操作调查</text>
    <text x="105" y="478" font-size="18" font-weight="700" fill="#067647">共同点：需要的东西不在当前仓库里，</text>
    <text x="105" y="508" font-size="18" font-weight="700" fill="#067647">只能从真实产物或运行观察中取得</text>
    <rect x="620" y="165" width="510" height="440" rx="20" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="2"/>
    <text x="655" y="212" font-size="23" font-weight="700" fill="#475467">不值得：仓库内工具更直接</text>
    <text x="655" y="262" font-size="19" fill="#344054">· 有完整源码的普通业务缺陷</text>
    <text x="655" y="302" font-size="19" fill="#344054">· 文档检索、知识库问答</text>
    <text x="655" y="342" font-size="19" fill="#344054">· 策略收益、指标正确性评估</text>
    <text x="655" y="382" font-size="19" fill="#344054">· 常规性能问题的诊断</text>
    <text x="655" y="478" font-size="18" font-weight="700" fill="#475467">共同点：代码搜索、断点、日志、测试</text>
    <text x="655" y="508" font-size="18" font-weight="700" fill="#475467">已经能回答问题，不缺观察能力</text>
  </g>
  <rect x="170" y="600" width="860" height="50" rx="14" fill="#EAF2FF" stroke="#84ADFF" stroke-width="2"/>
  <text x="255" y="632" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1849A9">一句话：决定接入的是任务的信息缺口，不是工具的能力清单</text>
</svg>
