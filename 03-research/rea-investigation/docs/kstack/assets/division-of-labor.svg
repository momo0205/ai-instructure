<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="28" fill="#FBFAF7"/>
  <text x="70" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18212F">REA 里谁在干活：大模型其实在工具层之外</text>
  <text x="70" y="116" font-family="Arial,sans-serif" font-size="19" fill="#667085">模型负责组织调查，工具负责接触目标，两者不互相替代</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="170" width="490" height="120" rx="20" fill="#F4EBFF" stroke="#B692F6" stroke-width="2"/>
    <text x="115" y="212" font-size="24" font-weight="700" fill="#6941C6">大模型（宿主 Agent）</text>
    <text x="115" y="246" font-size="18" fill="#344054">拆问题、读材料、提假设、写候选实现</text>
    <text x="115" y="272" font-size="17" fill="#667085">不能做的事：凭命名宣布某条调用已经发生</text>
    <rect x="630" y="170" width="490" height="120" rx="20" fill="#EAF2FF" stroke="#84ADFF" stroke-width="2"/>
    <text x="665" y="212" font-size="24" font-weight="700" fill="#1849A9">REA 工具层</text>
    <text x="665" y="246" font-size="18" fill="#344054">校验请求、绑定目标、组织分析、保留证据</text>
    <text x="665" y="272" font-size="17" fill="#667085">不能做的事：保证恢复任意原始源码</text>
    <rect x="80" y="330" width="490" height="120" rx="20" fill="#ECFDF3" stroke="#75E0A7" stroke-width="2"/>
    <text x="115" y="372" font-size="24" font-weight="700" fill="#067647">解析器与观察器</text>
    <text x="115" y="406" font-size="18" fill="#344054">真正读取字节：语法解析、反编译引擎、运行观察</text>
    <text x="115" y="432" font-size="17" fill="#667085">不能做的事：覆盖所有运行分支与环境</text>
    <rect x="630" y="330" width="490" height="120" rx="20" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
    <text x="665" y="372" font-size="24" font-weight="700" fill="#B54708">独立验证（人与测试）</text>
    <text x="665" y="406" font-size="18" fill="#344054">冻结验收条件，判断有限声明是否满足</text>
    <text x="665" y="432" font-size="17" fill="#667085">不能做的事：用有限样本推出全局等价</text>
  </g>
  <path d="M570 230h60M570 390h60" stroke="#98A2B3" stroke-width="4"/>
  <path d="M615 220l16 10-16 10M615 380l16 10-16 10" fill="#98A2B3"/>
  <path d="M860 290v40M330 290v40" stroke="#98A2B3" stroke-width="4"/>
  <path d="M850 318l10 14 10-14M320 318l10 14 10-14" fill="#98A2B3"/>
  <rect x="170" y="520" width="860" height="90" rx="18" fill="#F2F4F7"/>
  <text x="210" y="558" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#18212F">关键事实：REA 的分析流程可以在完全没有大模型参与时跑完</text>
  <text x="210" y="590" font-family="Arial,sans-serif" font-size="18" fill="#667085">它首先是给 AI 用的逆向工具系统，其次才是“AI 逆向”——这个顺序决定了证据从哪来</text>
</svg>
